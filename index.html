<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BytePort Central</title>
<style>
:root{--red1:#e11d2a;--red2:#8a0f22;--maroon:#3b0612;--ink:#1a0509;--acc:#ffd23f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:#fff;font:700 16px "Trebuchet MS","Segoe UI",Verdana,sans-serif}
body{background:linear-gradient(135deg,#e11d2a,#8a0f22,#3b0612,#b3121f,#e11d2a);background-size:400% 400%;animation:flow 16s ease-in-out infinite;user-select:none}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body.still{animation:none;background-position:30% 50%}
#bg{position:fixed;inset:0;pointer-events:none}
#bg:before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.18) 1.5px,transparent 2px) 0 0/22px 22px;opacity:.6}
body.nofx #bg:before{display:none}
#logo{position:fixed;left:3vw;top:2vh;width:min(44vh,80vw);transform-origin:left top;transition:transform .3s;cursor:pointer;z-index:3}
#logo .lw{position:relative;transition:transform .35s cubic-bezier(.3,1.6,.5,1),filter .3s}
#logo img{display:block;width:100%;height:auto;filter:drop-shadow(0 .8vh 0 rgba(0,0,0,.35));-webkit-user-drag:none;transition:filter .3s}
#logo .lw:after{content:"";position:absolute;inset:0;pointer-events:none;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%) 160% 0/250% 100% no-repeat}
#logo:hover .lw{transform:scale(1.07) rotate(-2deg);animation:jelly .8s cubic-bezier(.3,1.4,.5,1)}
#logo:hover .lw:after{animation:shine .9s ease-out}
#logo:hover img{filter:drop-shadow(0 .8vh 0 rgba(0,0,0,.35)) drop-shadow(0 0 1.6vh rgba(255,255,255,.7))}
#logo:active .lw{transform:scale(.97)}
@keyframes jelly{0%{transform:scale(1) rotate(0)}22%{transform:scale(1.14,.92) rotate(-4deg)}44%{transform:scale(.95,1.1) rotate(3deg)}66%{transform:scale(1.09,.98) rotate(-3deg)}100%{transform:scale(1.07) rotate(-2deg)}}
@keyframes shine{to{background-position:-60% 0}}
body.still #logo:hover .lw,body.still #logo:hover .lw:after{animation:none}
body:not(.home) #logo{transform:scale(.55)}
.screen{position:fixed;inset:0;display:none}.screen.on{display:block}
#menu{list-style:none;margin:0;padding:0;position:absolute;left:0;top:35vh;width:min(560px,92vw)}
#menu li{position:relative;display:flex;align-items:center;gap:14px;height:min(9vh,64px);margin:min(1.6vh,12px) 0;padding:0 20px 0 calc(34px + var(--i)*16px);background:linear-gradient(90deg,rgba(26,5,9,.7),rgba(26,5,9,.4));border-radius:0 12px 12px 0;font-size:min(4.2vh,30px);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;opacity:.85;overflow:hidden;animation:in .45s calc(var(--i)*.07s) cubic-bezier(.2,1.2,.4,1) backwards;transition:background .15s,opacity .15s,filter .15s,padding-left .22s cubic-bezier(.3,1.5,.5,1)}
#menu li.on{padding-left:calc(52px + var(--i)*16px);opacity:1;background:linear-gradient(90deg,rgba(26,5,9,.92),rgba(26,5,9,.55));filter:drop-shadow(0 0 10px rgba(255,255,255,.5))}
#menu li.on:before{content:"";position:absolute;left:8px;top:50%;width:14px;height:14px;margin-top:-7px;background:var(--acc);transform:rotate(45deg);border:2px solid var(--ink)}
#menu li .t{flex:1;text-shadow:0 2px 0 var(--ink);transition:letter-spacing .2s}
#menu li.on .t{letter-spacing:.1em}
#menu li:after{content:"";position:absolute;top:0;bottom:0;left:-50%;width:35%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);pointer-events:none}
#menu li.on:after{animation:sweep .7s ease-out}
@keyframes sweep{to{left:130%}}
#menu li .ic{width:min(6vh,42px);height:min(6vh,42px);border-radius:50%;border:3px solid #fff;background:var(--ink);display:grid;place-items:center;overflow:hidden;flex:none;position:relative;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
#menu li.on .ic{transform:scale(1.15) rotate(10deg)}
#menu li .ic img.cy{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
#menu li .ic svg,#menu li .ic img{width:70%;height:70%;object-fit:cover}
#menu li .ic img{width:100%;height:100%}
@keyframes in{from{transform:translateX(-120%)}}
body.still #menu li{animation:none}
body.still #menu li.on:after{animation:none}
.panel{position:absolute;inset:26vh 4vw 84px 4vw;background:rgba(26,5,9,.84);border:4px solid var(--ink);border-radius:14px;padding:2.2vh 2.4vw;display:flex;flex-direction:column;min-height:0;box-shadow:0 10px 0 rgba(0,0,0,.3)}
.panel h2{margin:0 0 1.4vh;font:900 min(4vh,30px) Impact,"Arial Black",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.panel p,.panel li{line-height:1.5;font-weight:600;color:#f3e3e5}
.panel .dim{color:#c9a3a8;font-size:14px}
/* ports: header + card grid */
#ports .top{display:flex;align-items:center;gap:14px;margin-bottom:1.2vh;flex-wrap:wrap}
#ports .top h2{margin:0;margin-right:auto}
#q{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);color:#fff;font:inherit;padding:8px 12px;border-radius:8px;outline:none;min-width:200px}
#q:focus{border-color:var(--acc)}
.chip{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);color:#fff;font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
.chip.on{background:var(--acc);color:var(--ink);border-color:var(--ink)}
#grid{flex:1;min-height:0;overflow-y:auto;padding:46px 6px 14px;margin-top:-20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:56px 22px;align-content:start;scrollbar-width:thin;scrollbar-color:#e11d2a transparent}
.card{position:relative;border:3px solid transparent;border-radius:16px;background:#2a0a11;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .12s,border-color .12s,box-shadow .12s}
.card.on{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 9px 0 rgba(0,0,0,.35),0 0 18px rgba(255,210,63,.35)}
.card .cov{aspect-ratio:16/8;border-radius:12px 12px 0 0;overflow:hidden;background:linear-gradient(135deg,#8a0f22,#3b0612)}
.card .cov img{width:100%;height:100%;object-fit:cover;display:block}
.card .covw{position:relative}
.card .ic{position:absolute;left:16px;bottom:-38px;width:76px;height:76px;border-radius:50%;border:5px solid #2a0a11;background:var(--ink);overflow:hidden;display:grid;place-items:center;font:900 30px Impact,sans-serif;z-index:2}
.card .ic img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:46px 16px 16px}
.card .nm{font:900 22px Impact,"Arial Black",sans-serif;text-transform:uppercase;line-height:1.15;color:#fff;margin-bottom:12px;word-break:break-word}
.card .acts{display:flex;gap:10px}
.card .play{flex:1;background:var(--acc);color:var(--ink);border:3px solid var(--ink);font:900 15px inherit;font-family:inherit;letter-spacing:.14em;padding:10px 16px;border-radius:8px;cursor:pointer}
.card .play:hover{filter:brightness(1.08)}
.card .fav{position:relative;width:48px;overflow:hidden;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.3);border-radius:8px;cursor:pointer;padding:0;display:grid;place-items:center;transition:border-color .4s,transform .15s}
.card .fav:active{transform:scale(.88)}
.card .fav.on{border-color:var(--ink)}
.fav .liq{position:absolute;left:0;top:0;width:100%;height:140%;transform:translateY(102%);transition:transform 1s cubic-bezier(.3,.75,.3,1);pointer-events:none}
.fav.on .liq{transform:translateY(-26%)}
.fav .liq svg{position:absolute;left:0;top:0;display:block;width:200%;height:100%;animation:slosh 2.2s linear infinite}
.fav .liq svg.bk{animation-duration:3.4s;animation-direction:reverse}
.fav .liq path{fill:#ff3347}.fav .liq svg.bk path{fill:#a80f1f}
@keyframes slosh{to{transform:translateX(-50%)}}
.fav .hs{position:relative;z-index:1;width:24px;height:24px;overflow:visible}
.fav .ho{fill:none;stroke:#fff;stroke-width:2;stroke-linejoin:round}
.fav .hw{transform:translateY(27px);transition:transform .95s cubic-bezier(.3,.75,.3,1) .1s}
.fav.on .hw{transform:translateY(-2px)}
.fav .hws{animation:hslosh 1.5s linear infinite}
@keyframes hslosh{to{transform:translateX(-24px)}}
.fav.pop .hs{animation:hpop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes hpop{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
body.still .fav .liq svg,body.still .fav .hws{animation:none}
.empty{grid-column:1/-1;color:#c9a3a8;font-weight:600;text-align:center;padding:30px}
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;margin:4px 0;border-radius:10px;font-size:20px;text-transform:uppercase;cursor:pointer;opacity:.7}
.set.on{opacity:1;background:rgba(255,70,80,.28)}
.set b{color:var(--acc)}
/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 4vw;background:rgba(26,5,9,.85);z-index:5}
#hint{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:#e6cdd0}
#links{display:flex;gap:10px;flex:none}
.lk{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:10px;border:3px solid var(--ink);color:#fff;text-decoration:none;font-size:14px;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .1s,filter .1s}
.lk:hover{transform:translateY(-2px);filter:brightness(1.12)}
.lk svg{width:20px;height:20px;fill:#fff}
.lk.dc{background:#5865f2}.lk.gh{background:#2b3137}
kbd{border:2px solid rgba(255,255,255,.55);border-radius:5px;padding:1px 7px;margin-right:6px;background:rgba(255,255,255,.1);color:#fff;font:inherit}
#toast{position:fixed;right:3vw;bottom:84px;background:var(--acc);color:var(--ink);padding:10px 16px;border:3px solid var(--ink);border-radius:8px;opacity:0;transition:opacity .2s;z-index:6}
@media(max-width:760px){#hint{display:none}#bar{justify-content:center}#grid{grid-template-columns:1fr}}

<script>
/* Put your real links here */
const LINKS={discord:"https://discord.gg/YOUR_INVITE",github:"https://github.com/YOUR_NAME"};
const $=id=>document.getElementById(id);
$("lk-dc").href=LINKS.discord;$("lk-gh").href=LINKS.github;
/* logo: feed the shine mask + click goes home */
$("logo").querySelector(".lw").style.setProperty("--logo",'url("'+$("logoimg").src+'")');
$("logo").onclick=()=>{if(scr!=="main")back()};
/* ---------- folder loading: /ports and /icons ---------- */
let MODS=[],loaded=false,loadErr=false;
const getJSON=async u=>{const r=await fetch(u,{cache:"no-cache"});if(!r.ok)throw new Error(u);return r.json()};
async function listDir(u,test){try{const r=await fetch(u,{cache:"no-cache"});if(!r.ok)return[];const d=new DOMParser().parseFromString(await r.text(),"text/html");
 return[...d.querySelectorAll("a")].map(a=>a.getAttribute("href")||"").filter(h=>h&&!/^([?#\/.]|[a-z]+:)/i.test(h)).map(h=>{try{return decodeURIComponent(h)}catch(e){return h}}).filter(test)}catch(e){return[]}}
const imgOk=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(true);i.onerror=()=>r(false);i.src=src});
async function loadPorts(){
 let ids=(await listDir("ports/",n=>n.endsWith("/"))).map(n=>n.slice(0,-1));
 if(!ids.length)ids=await getJSON("ports/ports.json");
 const out=[];
 for(const id of ids){const base=new URL("ports/"+encodeURIComponent(id)+"/",location.href);const R=p=>new URL(p,base).href;
  let meta={};try{meta=await getJSON(R("meta.json"))}catch(e){}
  out.push({id,name:meta.name||id,icon:R(meta.icon||"icon.png"),cover:R(meta.cover||"cover.jpg"),file:R(meta.file||"index.html"),songs:meta.songs,desc:meta.desc,credits:meta.credits})}
 return out}
async function loadIcons(){
 let names=await listDir("icons/",n=>/\.(png|jpe?g|gif|webp|svg|avif)$/i.test(n));
 if(!names.length){try{names=await getJSON("icons/icons.json")}catch(e){names=[]}}
 let list=names.map(n=>"icons/"+encodeURIComponent(n));
 if(!list.length)list=MODS.map(m=>m.icon);
 const ok=await Promise.all(list.map(imgOk));return list.filter((_,i)=>ok[i])}
/* ---------- icon swipe in the Ports circle ---------- */
const SV={clock:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 heart:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21S3 14.5 3 8.5A5 5 0 0112 6a5 5 0 019 2.5C21 14.5 12 21 12 21z"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
 play:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5l12 7-12 7z"/></svg>'};
const CY={list:[],i:0,box:null,timer:0};
const mkImg=s=>{const m=new Image();m.className="cy";m.alt="";m.draggable=false;m.src=s;return m};
function startCycle(){clearInterval(CY.timer);const b=CY.box;b.innerHTML="";CY.i=0;
 if(!CY.list.length){b.innerHTML=SV.play;return}
 b.appendChild(mkImg(CY.list[0]));
 if(CY.list.length>1)CY.timer=setInterval(nextIcon,3200)}
function nextIcon(){if(ST.still||scr!=="main"||document.hidden)return;const b=CY.box,cur=b.querySelector("img.cy:last-of-type");
 CY.i=(CY.i+1)%CY.list.length;const nx=mkImg(CY.list[CY.i]);nx.style.transform="translateX(-100%)";b.appendChild(nx);void nx.offsetWidth;
 const T="transform .65s cubic-bezier(.65,0,.25,1)";nx.style.transition=T;nx.style.transform="translateX(0)";
 if(cur){cur.style.transition=T;cur.style.transform="translateX(100%)";setTimeout(()=>cur.remove(),700)}}
const ITEMS=[{id:"ports",label:"Ports",ic:""},{id:"soon",label:"Coming Soon",ic:SV.clock},{id:"credits",label:"Credits",ic:SV.heart},{id:"settings",label:"Settings",ic:SV.gear}];
const HP="M12 21S3 14.5 3 8.5A5 5 0 0112 6a5 5 0 019 2.5C21 14.5 12 21 12 21z";
const WAVE="M0 3q3-2 6 0t6 0t6 0t6 0t6 0t6 0t6 0t6 0V40H0z";
const BWAVE="M0 8q12.5-8 25 0t25 0t25 0t25 0t25 0t25 0t25 0t25 0V60H0z";
const heartSVG=n=>'<span class="liq"><svg class="bk" viewBox="0 0 200 60" preserveAspectRatio="none"><path d="'+BWAVE+'"/></svg><svg viewBox="0 0 200 60" preserveAspectRatio="none"><path d="'+BWAVE+'"/></svg></span>'+
 '<svg class="hs" viewBox="0 0 24 24"><defs><clipPath id="hc'+n+'"><path d="'+HP+'"/></clipPath></defs><g clip-path="url(#hc'+n+')"><g class="hw"><g class="hws"><path d="'+WAVE+'" fill="#fff"/></g></g></g><path class="ho" d="'+HP+'"/></svg>';
let scr="main",mi=0,view=[],pi=0,si=0,favOnly=false;
let ST={fx:true,still:false,newtab:false};
try{Object.assign(ST,JSON.parse(localStorage.getItem("bpSet")||"{}"))}catch(e){}
let FAV=[];try{FAV=JSON.parse(localStorage.getItem("bpFav")||"[]")}catch(e){}
function saveST(){try{localStorage.setItem("bpSet",JSON.stringify(ST))}catch(e){}document.body.classList.toggle("nofx",!ST.fx);document.body.classList.toggle("still",ST.still)}
saveST();
function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1600)}
/* ---------- main menu ---------- */
const menu=$("menu");
ITEMS.forEach((it,i)=>{const li=document.createElement("li");li.style.setProperty("--i",i);li.innerHTML='<span class="t"></span><span class="ic"></span>';li.querySelector(".t").textContent=it.label;li.querySelector(".ic").innerHTML=it.ic;
 if(it.id==="ports"){CY.box=li.querySelector(".ic");CY.box.innerHTML=SV.play}
 li.onmouseenter=()=>{if(scr==="main"){mi=i;paint()}};li.onclick=()=>{mi=i;go(it.id)};menu.appendChild(li)});
function paint(){[...menu.children].forEach((l,i)=>l.classList.toggle("on",i===mi))}
function go(id){scr=id;document.body.classList.toggle("home",id==="main");document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id==="s-"+id));
 if(id==="ports"){filter();let last=null;try{last=localStorage.getItem("bpLast")}catch(e){}pi=Math.max(0,view.findIndex(m=>m.id===last));renderPorts()}
 if(id==="credits")renderCredits();if(id==="settings")renderSet();hint()}
function back(){go("main");$("s-main").classList.add("on")}
/* ---------- ports (cards) ---------- */
const isFav=m=>FAV.includes(m.id);
function saveFav(){try{localStorage.setItem("bpFav",JSON.stringify(FAV))}catch(e){}}
function filter(){const t=$("q").value.toLowerCase();
 view=MODS.filter(m=>m.name.toLowerCase().includes(t)&&(!favOnly||isFav(m)));
 view.sort((a,b)=>isFav(b)-isFav(a))}
function toggleFav(m,btn){FAV=isFav(m)?FAV.filter(f=>f!==m.id):FAV.concat(m.id);saveFav();
 btn.classList.toggle("on",isFav(m));btn.classList.remove("pop");void btn.offsetWidth;btn.classList.add("pop");
 btn.onanimationend=e=>{if(e.target.classList&&e.target.classList.contains("hs"))btn.classList.remove("pop")};
 toast(isFav(m)?"Added to favorites":"Removed from favorites");
 if(favOnly&&!isFav(m)){setTimeout(()=>{if(scr!=="ports")return;filter();pi=Math.min(pi,Math.max(0,view.length-1));renderPorts()},1100)}}
function renderPorts(){const g=$("grid");g.innerHTML="";
 if(!loaded){g.innerHTML='<div class="empty">'+(loadErr?"Couldn't read the <b>ports</b> folder. Open this page from a web server (or host it) - browsers block reading folders from file://.":"Loading ports...")+'</div>';return}
 view.forEach((m,i)=>{const c=document.createElement("div");c.className="card";c.setAttribute("role","option");
  c.innerHTML='<div class="covw"><div class="cov"></div><div class="ic"></div></div><div class="body"><div class="nm"></div><div class="acts"><button class="play">PLAY</button><button class="fav" title="Favorite" aria-label="Favorite">'+heartSVG(i)+'</button></div></div>';
  const cv=document.createElement("img");cv.alt="";cv.onerror=()=>cv.remove();cv.src=m.cover;c.querySelector(".cov").appendChild(cv);
  const ic=c.querySelector(".ic"),im=document.createElement("img");im.alt="";im.onerror=()=>{im.remove();ic.textContent=m.name.charAt(0)};im.src=m.icon;ic.appendChild(im);
  c.querySelector(".nm").textContent=m.name;
  const f=c.querySelector(".fav");f.classList.toggle("on",isFav(m));
  f.onclick=e=>{e.stopPropagation();toggleFav(m,f)};
  c.querySelector(".play").onclick=e=>{e.stopPropagation();play(m)};
  c.onmouseenter=()=>{pi=i;pp()};c.onclick=()=>{pi=i;pp()};
  g.appendChild(c)});
 if(!view.length)g.innerHTML='<div class="empty">'+(favOnly?"No favorites yet - tap the heart on a port.":"No ports match.")+'</div>';
 $("favf").classList.toggle("on",favOnly);pp()}
function pp(){if(pi>=view.length)pi=view.length-1;if(pi<0)pi=0;const g=$("grid");
 [...g.children].forEach((c,i)=>c.classList.toggle("on",i===pi&&!!view.length));
 const c=g.children[pi];if(c&&view.length&&c.scrollIntoView)c.scrollIntoView({block:"nearest"})}
function cols(){return Math.max(1,getComputedStyle($("grid")).gridTemplateColumns.split(" ").length)}
function play(m){if(!m)return;try{localStorage.setItem("bpLast",m.id)}catch(e){}if(ST.newtab)window.open(m.file,"_blank");else location.href=m.file}
$("q").addEventListener("input",()=>{filter();pi=0;renderPorts()});
$("favf").onclick=()=>{favOnly=!favOnly;filter();pi=0;renderPorts()};
/* ---------- credits / settings ---------- */
function renderCredits(){const c=$("cr");c.innerHTML="<p><b>BytePort Central</b> - web ports of Friday Night Funkin' mods.</p>";
 MODS.forEach(m=>{const d=document.createElement("p");d.innerHTML="<b></b><br><span class='dim'></span>";d.querySelector("b").textContent=m.name;d.querySelector(".dim").textContent=m.credits||"";c.appendChild(d)});
 const f=document.createElement("p");f.className="dim";f.textContent="Friday Night Funkin' is by ninjamuffin99, PhantomArcade, evilsk8r and kawaisprite. Ports are fan-made and unofficial.";c.appendChild(f)}
const SETS=[["Background dots","fx"],["Reduce motion","still"],["Open ports in new tab","newtab"],["Forget last played",null]];
function renderSet(){const s=$("st");s.innerHTML="";SETS.forEach((r,i)=>{const d=document.createElement("div");d.className="set"+(i===si?" on":"");d.innerHTML="<span></span><b></b>";d.firstChild.textContent=r[0];d.lastChild.textContent=r[1]?(ST[r[1]]?"ON":"OFF"):"PRESS";d.onclick=()=>{si=i;toggle()};s.appendChild(d)})}
function toggle(){const r=SETS[si];if(r[1]){ST[r[1]]=!ST[r[1]];saveST()}else{try{localStorage.removeItem("bpLast")}catch(e){}toast("Cleared")}renderSet()}
/* ---------- keys ---------- */
function hint(){const k=(a,t)=>"<span><kbd>"+a+"</kbd>"+t+"</span>";
 $("hint").innerHTML=scr==="main"?k("UP / DOWN","choose")+k("ENTER","open"):scr==="ports"?k("ARROWS","choose")+k("ENTER","play")+k("F","favorite")+k("/","search")+k("ESC","back"):scr==="settings"?k("UP / DOWN","choose")+k("ENTER / LEFT / RIGHT","change")+k("ESC","back"):k("ESC","back")}
addEventListener("keydown",e=>{const k=e.key;
 if(scr==="main"){if(k==="ArrowDown")mi=(mi+1)%ITEMS.length;else if(k==="ArrowUp")mi=(mi+ITEMS.length-1)%ITEMS.length;else if(k==="Enter"||k===" ")go(ITEMS[mi].id);else return;paint();e.preventDefault();return}
 if(scr==="ports"&&document.activeElement===$("q")){if(k==="Escape"){$("q").value="";$("q").blur();$("q").dispatchEvent(new Event("input"))}else if(k==="Enter"||k==="ArrowDown"||k==="ArrowUp"){$("q").blur();if(k==="Enter")play(view[pi])}return}
 if(k==="Escape"||k==="Backspace"){back();e.preventDefault();return}
 if(scr==="ports"){const n=view.length,c=cols();if(k==="ArrowRight")pi=Math.min(n-1,pi+1);else if(k==="ArrowLeft")pi=Math.max(0,pi-1);else if(k==="ArrowDown")pi=Math.min(n-1,pi+c);else if(k==="ArrowUp")pi=Math.max(0,pi-c);else if(k==="Home")pi=0;else if(k==="End")pi=n-1;else if(k==="Enter"||k===" ")play(view[pi]);else if(k==="f"||k==="F"){const card=$("grid").children[pi];if(view[pi]&&card)toggleFav(view[pi],card.querySelector(".fav"))}else if(k==="/"){$("q").focus()}else return;pp();e.preventDefault()}
 else if(scr==="settings"){if(k==="ArrowDown")si=(si+1)%SETS.length;else if(k==="ArrowUp")si=(si+SETS.length-1)%SETS.length;else if(k==="Enter"||k===" "||k==="ArrowLeft"||k==="ArrowRight"){toggle();e.preventDefault();return}else return;renderSet();e.preventDefault()}});
paint();hint();
(async function init(){
 try{MODS=await loadPorts();loaded=true}catch(e){loadErr=true}
 try{CY.list=await loadIcons()}catch(e){CY.list=[]}
 startCycle();
 if(scr==="ports"){filter();renderPorts()}
})();
</script></body></html>
